<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUPY Blog – Script, Hook e Strategie Virali</title>
<meta name="description" content="Risorse gratuite su come scrivere script che fermano lo scroll, costruire hook irresistibili e creare contenuti video che portano risultati.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;1,400&family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --black:#111;--white:#fff;--off:#f7f6f3;--border:#e5e3de;--muted:#999;
  --green:#6100FF;--green-dark:#4d00cc;--green-bg:#f0eaff;
  --mono:'Courier New',monospace;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
}
body{font-family:var(--sans);background:var(--white);color:var(--black);font-size:16px;line-height:1.6;overflow-x:hidden}
body::before{content:'';position:fixed;top:56px;left:0;right:0;bottom:0;background-image:radial-gradient(circle,#b0b0b0 1px,transparent 1px);background-size:24px 24px;opacity:0.4;pointer-events:none;z-index:-1}

nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:56px;background:rgba(255,255,255,0.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--black);text-decoration:none;letter-spacing:-0.02em}
.logo span{color:var(--green)}
.nav-r{display:flex;align-items:center;gap:1.5rem}
.nav-link{font-size:0.875rem;color:var(--muted);text-decoration:none;transition:color .15s}
.nav-link:hover{color:var(--black)}
.nav-link.active{color:var(--black);font-weight:600}
.nav-btn{background:var(--black);color:var(--white);padding:.45rem 1.1rem;border-radius:6px;font-size:0.875rem;font-weight:600;text-decoration:none;transition:opacity .15s}
.nav-btn:hover{opacity:.82}

.blog-hero{max-width:860px;margin:0 auto;padding:5rem 2rem 3.5rem;text-align:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green-dark);background:var(--green-bg);padding:.3rem .8rem;border-radius:100px;margin-bottom:1.5rem}
.hero-eyebrow::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blog-hero h1{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.04em;line-height:1.06;margin-bottom:1.1rem}
.blog-hero h1 em{font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-weight:400;color:var(--green)}
.blog-hero p{font-size:1.05rem;color:#666;line-height:1.65;max-width:560px;margin:0 auto}

.filter-bar{max-width:1100px;margin:0 auto;padding:0 2rem 2rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.filter-btn{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .85rem;border-radius:100px;border:1.5px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:var(--green-bg);border-color:var(--green);color:var(--green-dark)}
.filter-btn.active{font-weight:700}

.blog-grid-wrap{max-width:1100px;margin:0 auto;padding:0 2rem 6rem}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}

/* Skeleton loader */
.skeleton-card{background:var(--off);border-radius:16px;overflow:hidden;border:1.5px solid var(--border)}
.skeleton-cover{width:100%;aspect-ratio:16/9;background:linear-gradient(90deg,var(--off) 25%,var(--border) 50%,var(--off) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
.skeleton-body{padding:1.5rem;display:flex;flex-direction:column;gap:.75rem}
.skeleton-line{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--off) 25%,var(--border) 50%,var(--off) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
.skeleton-line.wide{width:90%}.skeleton-line.mid{width:65%}.skeleton-line.short{width:40%}
.skeleton-line.title{height:20px;width:85%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.article-card{background:var(--white);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s;display:flex;flex-direction:column}
.article-card:hover{border-color:var(--green);box-shadow:0 6px 28px rgba(97,0,255,.1);transform:translateY(-2px)}
.article-card.featured{grid-column:span 2}
.card-cover{width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--off);position:relative}
.card-cover.small{aspect-ratio:16/7}
.card-cover img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.article-card:hover .card-cover img{transform:scale(1.04)}
.card-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green-bg) 0%,#e8e0ff 100%)}
.card-body{padding:1.5rem;display:flex;flex-direction:column;flex:1}
.card-meta{display:flex;align-items:center;gap:.75rem;margin-bottom:.85rem;flex-wrap:wrap}
.card-cat{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:var(--green-bg);color:var(--green-dark);padding:.18rem .55rem;border-radius:4px;font-weight:700}
.card-date,.card-read{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.card-title{font-size:1.1rem;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-bottom:.6rem}
.article-card.featured .card-title{font-size:1.5rem}
.card-subtitle{font-size:.875rem;color:#555;line-height:1.6;flex:1}
.card-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.75rem}
.card-tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;padding:.15rem .45rem;border-radius:4px;background:var(--off);color:var(--muted);border:1px solid var(--border)}
.card-footer{margin-top:1.25rem;display:flex;align-items:center;justify-content:space-between}
.card-author{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.card-author-dot{width:20px;height:20px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:var(--green-dark)}
.card-arrow{font-size:.8rem;color:var(--green);font-weight:700;opacity:0;transition:opacity .15s}
.article-card:hover .card-arrow{opacity:1}

.empty-blog{text-align:center;padding:6rem 2rem;color:var(--muted);grid-column:1/-1}
.empty-blog p{font-size:1rem;line-height:1.7;margin-bottom:1.5rem}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:3rem 1.5rem;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--white);border-radius:20px;width:100%;max-width:760px;border:1.5px solid var(--border);transform:translateY(24px);transition:transform .25s;position:relative;overflow:hidden}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-close{position:absolute;top:1.25rem;right:1.25rem;z-index:10;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--muted);transition:all .15s}
.modal-close:hover{background:var(--black);color:#fff;border-color:var(--black)}
.modal-cover{width:100%;aspect-ratio:16/7;object-fit:cover;display:block}
.modal-cover-placeholder{width:100%;aspect-ratio:16/7;background:linear-gradient(135deg,var(--green-bg) 0%,#e8e0ff 100%);display:flex;align-items:center;justify-content:center}
.modal-body{padding:2.5rem}
.modal-meta{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap}
.modal-cat{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;background:var(--green-bg);color:var(--green-dark);padding:.22rem .6rem;border-radius:4px;font-weight:700}
.modal-date,.modal-read{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.modal-body h1{font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:800;letter-spacing:-.035em;line-height:1.12;margin-bottom:1rem}
.modal-subtitle{font-size:1.05rem;color:#555;line-height:1.65;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:1.5rem}
.article-content{font-size:.95rem;line-height:1.8;color:#333}
.article-content h2{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;margin:2rem 0 .6rem;color:var(--black)}
.article-content h3{font-size:1.1rem;font-weight:700;margin:1.5rem 0 .5rem;color:var(--black)}
.article-content p{margin-bottom:1rem}
.article-content strong{font-weight:700;color:var(--black)}
.article-content ul,.article-content ol{padding-left:1.5rem;margin-bottom:1rem}
.article-content li{margin-bottom:.4rem}
.article-content blockquote{border-left:3px solid var(--green);padding:.75rem 1.25rem;background:var(--green-bg);margin:1.5rem 0;border-radius:0 10px 10px 0;color:#444;font-style:italic}
.modal-author-row{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.modal-author{display:flex;align-items:center;gap:.6rem}
.modal-author-dot{width:28px;height:28px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--green-dark);flex-shrink:0}
.modal-author strong{display:block;font-size:.85rem;color:var(--black)}
.modal-author span{font-size:.75rem;color:var(--muted)}
.modal-tags{display:flex;flex-wrap:wrap;gap:.35rem}
.modal-tag{font-family:var(--mono);font-size:.62rem;padding:.18rem .5rem;border-radius:4px;background:var(--off);color:var(--muted);border:1px solid var(--border)}
.modal-cta{margin:2rem 0 0;background:var(--black);color:#fff;border-radius:14px;padding:2rem;text-align:center}
.modal-cta h3{font-size:1.1rem;font-weight:700;margin-bottom:.5rem}
.modal-cta p{font-size:.875rem;color:#aaa;margin-bottom:1.25rem;line-height:1.55}
.modal-cta a{display:inline-block;background:var(--green);color:#fff;padding:.7rem 1.75rem;border-radius:8px;font-weight:700;text-decoration:none;font-size:.9rem;transition:background .15s}
.modal-cta a:hover{background:var(--green-dark)}

/* Share bar */
.share-bar{display:flex;align-items:center;gap:.5rem;margin-top:1rem}
.share-bar span{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.share-btn{font-size:.75rem;font-weight:600;font-family:var(--sans);padding:.28rem .7rem;border-radius:5px;border:1.5px solid var(--border);background:var(--off);cursor:pointer;color:var(--muted);transition:all .12s}
.share-btn:hover{border-color:var(--green);color:var(--green-dark);background:var(--green-bg)}

footer{border-top:1px solid var(--border);padding:2.5rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.footer-links{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.footer-links a{font-size:.8rem;color:var(--muted);text-decoration:none;transition:color .15s}
.footer-links a:hover{color:var(--black)}
footer span{font-size:.75rem;color:var(--muted);font-family:var(--mono)}

@media(max-width:900px){.blog-grid{grid-template-columns:1fr 1fr}.article-card.featured{grid-column:span 2}}
@media(max-width:600px){.blog-grid{grid-template-columns:1fr}.article-card.featured{grid-column:span 1}.blog-hero{padding:3.5rem 1.5rem 2.5rem}.modal-body{padding:1.5rem}.modal-overlay{padding:1rem .75rem}}
</style>
</head>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tklrhmvmdcnhgjeepnin.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0XFGo7JQnz2qeIvIBVX2Dg_xiyAjJfe';

const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

let allArticles = [];
let currentFilter = 'all';

async function fetchArticles() {
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/articles?status=eq.published&order=created_at.desc`,
    { headers: HEADERS }
  );
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function formatDate(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-');
  const months = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function initials(name) {
  return (name||'DU').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

function filterArticles(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const articles = currentFilter === 'all'
    ? allArticles
    : allArticles.filter(a => a.category === currentFilter);

  const grid = document.getElementById('blogGrid');

  if (!articles.length) {
    grid.innerHTML = `<div class="empty-blog">
      <p style="font-size:2rem;margin-bottom:.75rem">✍️</p>
      <p>Nessun articolo ancora${currentFilter !== 'all' ? ' in questa categoria' : ''}.</p>
    </div>`;
    return;
  }

  grid.innerHTML = articles.map((a, i) => {
    const featured = i === 0 && articles.length > 1;
    const coverHtml = a.cover
      ? `<div class="card-cover${featured ? '' : ' small'}"><img src="${a.cover}" alt="${a.title}" loading="lazy"></div>`
      : `<div class="card-cover${featured ? '' : ' small'}"><div class="card-cover-placeholder"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6100FF" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div></div>`;

    const tagsHtml = (a.tags||[]).length
      ? `<div class="card-tags">${a.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>` : '';

    return `<div class="article-card${featured ? ' featured' : ''}" onclick="openArticle('${a.id}')">
      ${coverHtml}
      <div class="card-body">
        <div class="card-meta">
          <span class="card-cat">${a.category}</span>
          <span class="card-date">${formatDate(a.date)}</span>
          <span class="card-read">${a.read_time} min</span>
        </div>
        <div class="card-title">${a.title}</div>
        ${a.subtitle ? `<div class="card-subtitle">${a.subtitle}</div>` : ''}
        ${tagsHtml}
        <div class="card-footer">
          <div class="card-author">
            <div class="card-author-dot">${initials(a.author)}</div>
            ${a.author}
          </div>
          <span class="card-arrow">Leggi →</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openArticle(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return;

  const coverHtml = a.cover
    ? `<img class="modal-cover" src="${a.cover}" alt="${a.title}">`
    : `<div class="modal-cover-placeholder"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#6100FF" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;

  const tagsHtml = (a.tags||[]).length
    ? `<div class="modal-tags">${a.tags.map(t=>`<span class="modal-tag">${t}</span>`).join('')}</div>` : '';

  const pageUrl = encodeURIComponent(window.location.href.split('?')[0] + '?a=' + id);
  const pageTitle = encodeURIComponent(a.title);

  document.getElementById('modalContent').innerHTML = `
    ${coverHtml}
    <div class="modal-body">
      <div class="modal-meta">
        <span class="modal-cat">${a.category}</span>
        <span class="modal-date">${formatDate(a.date)}</span>
        <span class="modal-read">${a.read_time} min di lettura</span>
      </div>
      <h1>${a.title}</h1>
      ${a.subtitle ? `<p class="modal-subtitle">${a.subtitle}</p>` : ''}
      <div class="article-content">${a.content || '<p>Contenuto non disponibile.</p>'}</div>
      <div class="modal-author-row">
        <div class="modal-author">
          <div class="modal-author-dot">${initials(a.author)}</div>
          <div>
            <strong>${a.author}</strong>
            <span>Team DUPY</span>
          </div>
        </div>
        ${tagsHtml}
      </div>
      <div class="share-bar">
        <span>Condividi</span>
        <button class="share-btn" onclick="copyLink('${id}')">🔗 Copia link</button>
        <a class="share-btn" href="https://twitter.com/intent/tweet?url=${pageUrl}&text=${pageTitle}" target="_blank" rel="noopener">𝕏 Twitter</a>
        <a class="share-btn" href="https://wa.me/?text=${pageTitle}%20${pageUrl}" target="_blank" rel="noopener">💬 WhatsApp</a>
      </div>
      <div class="modal-cta">
        <h3>Pronto a costruire script che fermano lo scroll?</h3>
        <p>Analizza il tuo video gratis e scopri il tuo Viral Score. Poi costruisci con DUPY.</p>
        <a href="index.html">Prova DUPY gratis →</a>
      </div>
    </div>`;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  history.pushState({ articleId: id }, '', '?a=' + id);
}

function copyLink(id) {
  const url = window.location.href.split('?')[0] + '?a=' + id;
  navigator.clipboard.writeText(url).then(() => {
    showToast('Link copiato!');
  });
}

function showToast(msg) {
  let t = document.getElementById('blogToast');
  if (!t) { t = document.createElement('div'); t.id='blogToast'; t.style.cssText='position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:#fff;padding:.7rem 1.5rem;border-radius:8px;font-size:.875rem;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999';document.body.appendChild(t); }
  t.textContent = msg;
  t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; }, 2500);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  history.pushState({}, '', window.location.pathname);
}
function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('popstate', () => {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
});

// Init
(async () => {
  try {
    allArticles = await fetchArticles();
    renderGrid();
    // Auto-open article from URL param
    const params = new URLSearchParams(window.location.search);
    if (params.get('a')) openArticle(params.get('a'));
  } catch (err) {
    document.getElementById('blogGrid').innerHTML = `<div class="empty-blog"><p>Errore nel caricamento degli articoli.<br><small style="color:#e04040">${err.message}</small></p></div>`;
  }
})();
</script>
