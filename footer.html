<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --black:#111;
  --white:#fff;
  --border:#e5e3de;
  --muted:#999;
  --green:#6100FF;
  --mono:'Courier New',monospace;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
}

body{font-family:var(--sans);background:var(--white);color:var(--black)}
footer{
  border-top:1px solid var(--border);
  padding:3.5rem 2rem 2rem;
  background:var(--white);
}

.footer-inner{
  max-width:1100px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.8fr 1fr 1fr 1fr 1fr;
  gap:2.5rem;
  align-items:start;
}

/* Brand column */
.footer-brand{}
.footer-logo{display:flex;align-items:center;margin-bottom:1rem;text-decoration:none}

.footer-col-title{
  font-family:var(--mono);
  font-size:.62rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:.85rem;
  display:block;
}

.footer-col a{
  display:block;
  font-size:.875rem;
  color:#444;
  text-decoration:none;
  margin-bottom:.55rem;
  transition:color .15s;
}
.footer-col a:hover{color:var(--black)}

/* Bottom bar */
.footer-bottom{
  max-width:1100px;
  margin:2.5rem auto 0;
  padding-top:1.5rem;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:1rem;
}
.footer-copy{
  font-family:var(--mono);
  font-size:.72rem;
  color:var(--muted);
  letter-spacing:.02em;
}

@media(max-width:860px){
  .footer-inner{
    grid-template-columns:1fr 1fr;
    gap:2rem;
  }
  .footer-brand{grid-column:span 2}
}
@media(max-width:500px){
  .footer-inner{grid-template-columns:1fr}
  .footer-brand{grid-column:span 1}
}
</style>
</head>
