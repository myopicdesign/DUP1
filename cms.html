<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUPY CMS – Pannello Articoli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;1,400&family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#111;--white:#fff;--off:#f7f6f3;--border:#e5e3de;--muted:#999;
  --green:#6100FF;--green-dark:#4d00cc;--green-bg:#f0eaff;
  --mono:'Courier New',monospace;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --red:#e04040;--yellow:#f0a500;
}
body{font-family:var(--sans);background:var(--off);color:var(--black);font-size:15px;line-height:1.6;min-height:100vh}

/* ── LOGIN SCREEN ── */
.login-overlay{
  position:fixed;inset:0;z-index:9999;
  background:var(--white);
  display:flex;align-items:center;justify-content:center;
  padding:1.5rem;
}
.login-overlay.hidden{display:none}
.login-box{
  width:100%;max-width:380px;
  background:var(--white);border:1.5px solid var(--border);
  border-radius:20px;padding:2.5rem 2rem;
  text-align:center;
}

.login-box h2{font-size:1.1rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.4rem}
.login-box p{font-size:.85rem;color:var(--muted);margin-bottom:1.75rem}
.login-field{position:relative;margin-bottom:1rem}
.login-field input{
  width:100%;padding:.75rem 2.75rem .75rem 1rem;
  border:1.5px solid var(--border);border-radius:10px;
  font-family:var(--sans);font-size:.95rem;outline:none;
  transition:border-color .15s;text-align:center;letter-spacing:.1em;
}
.login-field input:focus{border-color:var(--green)}
.login-field input.error{border-color:var(--red);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toggle-pw{
  position:absolute;right:.85rem;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--muted);padding:0;font-size:1rem;
  transition:color .15s;
}
.toggle-pw:hover{color:var(--black)}
.login-btn{
  width:100%;padding:.8rem;border-radius:10px;border:none;
  background:var(--green);color:#fff;font-family:var(--sans);
  font-size:.95rem;font-weight:700;cursor:pointer;
  transition:background .15s,transform .1s;margin-top:.25rem;
}
.login-btn:hover{background:var(--green-dark);transform:translateY(-1px)}
.login-error{font-size:.8rem;color:var(--red);margin-top:.75rem;min-height:1rem}
.login-hint{font-size:.75rem;color:var(--muted);margin-top:1.5rem;line-height:1.5}
.logout-btn{
  font-size:.75rem;font-family:var(--mono);color:var(--muted);
  background:none;border:none;cursor:pointer;text-decoration:underline;
  transition:color .15s;
}
.logout-btn:hover{color:var(--red)}

nav{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;height:56px;
  background:rgba(255,255,255,0.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.logo{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--black);text-decoration:none;letter-spacing:-0.02em}
.logo span{color:var(--green)}
.nav-r{display:flex;align-items:center;gap:1rem}
.nav-link{font-size:0.875rem;color:var(--muted);text-decoration:none;transition:color .15s}
.nav-link:hover{color:var(--black)}
.cms-badge{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;background:var(--green-bg);color:var(--green-dark);padding:.25rem .65rem;border-radius:4px}

.cms-wrap{max-width:1100px;margin:0 auto;padding:2.5rem 2rem 6rem;display:grid;grid-template-columns:1fr 360px;gap:2rem;align-items:start}

.editor-panel{background:var(--white);border-radius:16px;border:1px solid var(--border);overflow:hidden}
.editor-header{padding:1.25rem 1.75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.editor-header h2{font-size:1rem;font-weight:700;letter-spacing:-.02em}
.editor-body{padding:1.75rem}

.field{margin-bottom:1.25rem}
label{display:block;font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
input[type=text],input[type=date],select,textarea{
  width:100%;font-family:var(--sans);font-size:.9rem;color:var(--black);
  border:1.5px solid var(--border);border-radius:8px;
  padding:.6rem .85rem;background:var(--white);
  transition:border-color .15s;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:160px;line-height:1.65}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

.cover-preview{
  width:100%;aspect-ratio:16/9;border-radius:10px;background:var(--off);border:1.5px dashed var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
  cursor:pointer;color:var(--muted);font-size:.85rem;transition:border-color .2s;overflow:hidden;position:relative;
}
.cover-preview:hover{border-color:var(--green)}
.cover-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px}
.cover-preview .cp-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;background:rgba(0,0,0,.35);color:#fff;opacity:0;transition:opacity .2s;border-radius:10px}
.cover-preview:hover .cp-label{opacity:1}
#coverInput{display:none}

.tags-wrap{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.tag{font-family:var(--mono);font-size:.7rem;padding:.2rem .6rem;border-radius:100px;background:var(--green-bg);color:var(--green-dark);display:flex;align-items:center;gap:.3rem}
.tag-rm{cursor:pointer;font-size:.8rem;opacity:.6}
.tag-rm:hover{opacity:1}
.tag-input{border:none;outline:none;font-size:.85rem;background:transparent;font-family:var(--sans);width:120px}

.content-toolbar{display:flex;gap:.35rem;flex-wrap:wrap;padding:.6rem;border:1.5px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;background:var(--off)}
.tb-btn{font-size:.78rem;font-family:var(--sans);font-weight:600;padding:.3rem .55rem;border-radius:5px;border:1px solid var(--border);background:var(--white);cursor:pointer;color:var(--black);transition:background .12s,border-color .12s}
.tb-btn:hover{background:var(--green-bg);border-color:var(--green);color:var(--green-dark)}
#contentArea{border:1.5px solid var(--border);border-top:none;border-radius:0 0 8px 8px;min-height:280px;padding:1rem;outline:none;font-size:.9rem;line-height:1.75;font-family:var(--sans)}
#contentArea h2{font-size:1.25rem;font-weight:700;margin:1rem 0 .4rem}
#contentArea h3{font-size:1.05rem;font-weight:700;margin:.8rem 0 .3rem}
#contentArea p{margin-bottom:.75rem}
#contentArea blockquote{border-left:3px solid var(--green);padding:.5rem 1rem;background:var(--green-bg);margin:.75rem 0;border-radius:0 8px 8px 0;color:#444;font-style:italic}
#contentArea ul,#contentArea ol{padding-left:1.5rem;margin-bottom:.75rem}
#contentArea li{margin-bottom:.3rem}

.action-row{display:flex;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--sans);font-weight:700;font-size:.875rem;padding:.65rem 1.4rem;border-radius:8px;border:none;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.82;transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:transparent;color:var(--black);border:1.5px solid var(--border)}
.btn-red{background:var(--red);color:#fff}
.btn-draft{background:var(--off);color:var(--muted);border:1.5px solid var(--border)}
.btn-draft:hover{background:var(--green-bg);color:var(--green-dark);border-color:var(--green)}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:#fff;padding:.7rem 1.5rem;border-radius:8px;font-size:.875rem;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}

.list-panel{display:flex;flex-direction:column;gap:1rem}
.list-header{display:flex;align-items:center;justify-content:space-between;padding:.25rem 0}
.list-header h3{font-size:.95rem;font-weight:700;letter-spacing:-.02em}
.list-count{font-family:var(--mono);font-size:.72rem;color:var(--muted)}

.article-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.25rem;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.article-card:hover{border-color:var(--green);box-shadow:0 2px 12px rgba(97,0,255,.08)}
.article-card.active{border-color:var(--green);background:var(--green-bg)}
.ac-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
.ac-title{font-size:.9rem;font-weight:700;letter-spacing:-.02em;flex:1}
.ac-status{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.18rem .5rem;border-radius:4px;flex-shrink:0}
.ac-status.published{background:#d1fae5;color:#065f46}
.ac-status.draft{background:var(--off);color:var(--muted);border:1px solid var(--border)}
.ac-meta{font-size:.75rem;color:var(--muted);display:flex;gap:.75rem;flex-wrap:wrap}
.ac-actions{display:flex;gap:.5rem;margin-top:.75rem}
.ac-btn{font-size:.72rem;font-weight:600;font-family:var(--sans);padding:.25rem .65rem;border-radius:5px;border:1px solid var(--border);background:var(--off);cursor:pointer;color:var(--muted);transition:all .12s}
.ac-btn:hover{border-color:var(--green);color:var(--green-dark);background:var(--green-bg)}
.ac-btn.del:hover{border-color:var(--red);color:var(--red);background:#fff0f0}

.empty-list{text-align:center;padding:3rem 1.5rem;color:var(--muted);font-size:.875rem;line-height:1.65}
.skeleton{background:linear-gradient(90deg,var(--off) 25%,var(--border) 50%,var(--off) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px;height:80px;margin-bottom:.75rem}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:780px){.cms-wrap{grid-template-columns:1fr}.field-row{grid-template-columns:1fr}}
</style>
</head>

<div class="cms-wrap">
  <div class="editor-panel">
    <div class="editor-header">
      <h2 id="editorTitle">Nuovo articolo</h2>
      <button class="btn btn-outline" onclick="resetForm()" style="padding:.35rem .85rem;font-size:.8rem">+ Nuovo</button>
    </div>
    <div class="editor-body">

      <div class="field">
        <label>Titolo</label>
        <input type="text" id="artTitle" placeholder="es. Come scrivere un hook che ferma lo scroll">
      </div>

      <div class="field">
        <label>Sottotitolo / Intro breve</label>
        <input type="text" id="artSubtitle" placeholder="Una frase che introduce l'articolo">
      </div>

      <div class="field-row">
        <div class="field">
          <label>Categoria</label>
          <select id="artCategory">
            <option value="Script">Script</option>
            <option value="Hook">Hook</option>
            <option value="Viral Strategy">Viral Strategy</option>
            <option value="Creator Tips">Creator Tips</option>
            <option value="Case Study">Case Study</option>
            <option value="Prodotto">Prodotto</option>
          </select>
        </div>
        <div class="field">
          <label>Data</label>
          <input type="date" id="artDate">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Autore</label>
          <input type="text" id="artAuthor" placeholder="Team DUPY">
        </div>
        <div class="field">
          <label>Tempo di lettura (min)</label>
          <input type="text" id="artReadTime" placeholder="5">
        </div>
      </div>

      <div class="field">
        <label>Immagine di copertina</label>
        <div class="cover-preview" id="coverPreview" onclick="document.getElementById('coverInput').click()">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span style="font-size:.8rem">Clicca per caricare</span>
          <div class="cp-label">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span style="font-size:.75rem">Cambia immagine</span>
          </div>
        </div>
        <input type="file" id="coverInput" accept="image/*">
        <input type="text" id="artCoverUrl" placeholder="oppure incolla l'URL dell'immagine" style="margin-top:.5rem">
      </div>

      <div class="field">
        <label>Tag</label>
        <div style="border:1.5px solid var(--border);border-radius:8px;padding:.5rem .75rem;display:flex;align-items:center;flex-wrap:wrap;gap:.4rem">
          <div class="tags-wrap" id="tagsWrap"></div>
          <input class="tag-input" id="tagInput" type="text" placeholder="Aggiungi tag + Invio">
        </div>
      </div>

      <div class="field">
        <label>Contenuto</label>
        <div class="content-toolbar">
          <button class="tb-btn" onclick="fmt('bold')"><b>B</b></button>
          <button class="tb-btn" onclick="fmt('italic')"><i>I</i></button>
          <button class="tb-btn" onclick="fmt('underline')"><u>U</u></button>
          <button class="tb-btn" onclick="wrapBlock('h2')">H2</button>
          <button class="tb-btn" onclick="wrapBlock('h3')">H3</button>
          <button class="tb-btn" onclick="fmt('insertUnorderedList')">• Lista</button>
          <button class="tb-btn" onclick="fmt('insertOrderedList')">1. Lista</button>
          <button class="tb-btn" onclick="insertQuote()">❝ Quote</button>
          <button class="tb-btn" onclick="fmt('removeFormat')">✕ Reset</button>
        </div>
        <div id="contentArea" contenteditable="true"></div>
      </div>

      <div class="action-row">
        <button class="btn btn-green" id="btnPublish" onclick="saveArticle('published')">Pubblica</button>
        <button class="btn btn-draft" id="btnDraft" onclick="saveArticle('draft')">Salva bozza</button>
        <button class="btn btn-outline" onclick="resetForm()">Annulla</button>
        <button class="btn btn-red" id="deleteBtn" style="display:none" onclick="deleteArticle()">Elimina</button>
      </div>

    </div>
  </div>

  <div class="list-panel">
    <div class="list-header">
      <h3>Articoli</h3>
      <span class="list-count" id="listCount">—</span>
    </div>
    <div id="articleList">
      <div class="skeleton"></div>
      <div class="skeleton" style="height:60px;opacity:.6"></div>
      <div class="skeleton" style="height:60px;opacity:.3"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── AUTH ──────────────────────────────────────────────
// Cambia questa password con la tua
const CMS_PASSWORD = 'bibimeravilla@96!';
const SESSION_KEY  = 'dupy_cms_auth';
const SESSION_TTL  = 8 * 60 * 60 * 1000; // 8 ore

function checkAuth() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const { expires } = JSON.parse(raw);
    return Date.now() < expires;
  } catch { return false; }
}

function tryLogin() {
  const val = document.getElementById('pwInput').value;
  const input = document.getElementById('pwInput');
  const err = document.getElementById('loginError');

  if (val === CMS_PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ expires: Date.now() + SESSION_TTL }));
    document.getElementById('loginOverlay').classList.add('hidden');
    err.textContent = '';
    loadList();
  } else {
    input.classList.add('error');
    err.textContent = 'Password errata. Riprova.';
    setTimeout(() => input.classList.remove('error'), 400);
    input.value = '';
    input.focus();
  }
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('loginOverlay').classList.remove('hidden');
  document.getElementById('pwInput').value = '';
  document.getElementById('loginError').textContent = '';
}

function togglePw() {
  const input = document.getElementById('pwInput');
  input.type = input.type === 'password' ? 'text' : 'password';
}

document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

// Mostra login se non autenticato, altrimenti carica subito
if (!checkAuth()) {
  document.getElementById('loginOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('pwInput').focus(), 100);
} else {
  document.getElementById('loginOverlay').classList.add('hidden');
}

const SUPABASE_URL = 'https://tklrhmvmdcnhgjeepnin.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0XFGo7JQnz2qeIvIBVX2Dg_xiyAjJfe';

const api = {
  headers: {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  },

  async list() {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/articles?order=created_at.desc`, { headers: this.headers });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },

  async insert(data) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/articles`, {
      method: 'POST', headers: this.headers, body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },

  async update(id, data) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/articles?id=eq.${id}`, {
      method: 'PATCH', headers: this.headers, body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },

  async delete(id) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/articles?id=eq.${id}`, {
      method: 'DELETE', headers: this.headers
    });
    if (!r.ok) throw new Error(await r.text());
  }
};

// ── STATE ─────────────────────────────────────────────
let editingId = null;
let tags = [];
let articles = [];

// ── TOAST ─────────────────────────────────────────────
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── TAGS ──────────────────────────────────────────────
function renderTags() {
  document.getElementById('tagsWrap').innerHTML = tags.map((t, i) =>
    `<span class="tag">${t} <span class="tag-rm" onclick="removeTag(${i})">×</span></span>`
  ).join('');
}
function removeTag(i) { tags.splice(i, 1); renderTags(); }
document.getElementById('tagInput').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ',') && e.target.value.trim()) {
    e.preventDefault();
    tags.push(e.target.value.trim());
    e.target.value = '';
    renderTags();
  }
});

// ── COVER ─────────────────────────────────────────────
document.getElementById('coverInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => showCoverPreview(ev.target.result);
  reader.readAsDataURL(file);
});
document.getElementById('artCoverUrl').addEventListener('blur', e => {
  if (e.target.value) showCoverPreview(e.target.value);
});
function showCoverPreview(src) {
  const p = document.getElementById('coverPreview');
  let img = p.querySelector('img');
  if (!img) { img = document.createElement('img'); p.prepend(img); }
  img.src = src;
}

// ── RICH TEXT ─────────────────────────────────────────
function fmt(cmd) { document.execCommand(cmd, false, null); document.getElementById('contentArea').focus(); }
function wrapBlock(tag) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const el = document.createElement(tag);
  el.appendChild(range.extractContents());
  range.insertNode(el);
}
function insertQuote() {
  const sel = window.getSelection();
  const text = sel.toString() || 'Cita qui…';
  document.execCommand('insertHTML', false, `<blockquote>${text}</blockquote><p><br></p>`);
}

// ── SET LOADING ────────────────────────────────────────
function setLoading(on) {
  ['btnPublish', 'btnDraft'].forEach(id => {
    const b = document.getElementById(id);
    b.disabled = on;
    if (on) {
      b._orig = b.innerHTML;
      b.innerHTML = `<span class="spinner"></span>${b.textContent}`;
    } else {
      b.innerHTML = b._orig || b.innerHTML;
    }
  });
}

// ── GITHUB ACTIONS TRIGGER ────────────────────────────
// Configura questi due valori con i tuoi dati GitHub.
// GH_TOKEN: vai su GitHub → Settings → Developer settings →
//   Personal access tokens → Fine-grained tokens → Generate new token
//   Seleziona il tuo repo, permessi: Actions (R&W) + Contents (R&W)
// GH_REPO: "tuousername/tuorepo"
const GH_TOKEN = 'INCOLLA_QUI_IL_TUO_GITHUB_TOKEN';
const GH_REPO  = 'TUOUSERNAME/TUOREPO'; // es. "mario/dupy-website"

async function triggerGitHubBuild() {
  if (GH_TOKEN.startsWith('INCOLLA')) {
    console.warn('⚠️ GitHub token non configurato — build non triggerata');
    return;
  }
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/dispatches`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${GH_TOKEN}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ event_type: 'publish-article' })
    });
    if (res.ok || res.status === 204) {
      console.log('✅ GitHub Action triggerata');
    } else {
      console.warn('⚠️ GitHub dispatch fallito:', res.status, await res.text());
    }
  } catch (e) {
    console.warn('⚠️ Impossibile triggerare GitHub Actions:', e.message);
  }
}

// ── SAVE ──────────────────────────────────────────────
async function saveArticle(status) {
  const title = document.getElementById('artTitle').value.trim();
  if (!title) { showToast('Inserisci un titolo', 'error'); return; }

  const coverImg = document.getElementById('coverPreview').querySelector('img');
  const coverUrl = document.getElementById('artCoverUrl').value.trim();

  const payload = {
    title,
    subtitle: document.getElementById('artSubtitle').value.trim(),
    category: document.getElementById('artCategory').value,
    date: document.getElementById('artDate').value || new Date().toISOString().slice(0, 10),
    author: document.getElementById('artAuthor').value.trim() || 'Team DUPY',
    read_time: document.getElementById('artReadTime').value.trim() || '5',
    tags: [...tags],
    cover: coverImg ? coverImg.src : coverUrl,
    content: document.getElementById('contentArea').innerHTML,
    status,
    updated_at: new Date().toISOString()
  };

  setLoading(true);
  try {
    if (editingId) {
      await api.update(editingId, payload);
    } else {
      const [created] = await api.insert(payload);
      editingId = created.id;
      document.getElementById('deleteBtn').style.display = 'inline-block';
    }
    document.getElementById('editorTitle').textContent = 'Modifica articolo';

    if (status === 'published') {
      showToast('✓ Pubblicato! Genero la pagina SEO…');
      await triggerGitHubBuild();
      setTimeout(() => showToast('✓ Pagina live in ~1 minuto'), 1200);
    } else {
      showToast('✓ Bozza salvata');
    }

    await loadList();
  } catch (err) {
    showToast('Errore: ' + err.message, 'error');
  } finally {
    setLoading(false);
  }
}

// ── DELETE ─────────────────────────────────────────────
async function deleteArticle() {
  if (!editingId || !confirm('Eliminare questo articolo?')) return;
  setLoading(true);
  try {
    await api.delete(editingId);
    showToast('Articolo eliminato');
    resetForm();
    await loadList();
  } catch (err) {
    showToast('Errore: ' + err.message, 'error');
  } finally {
    setLoading(false);
  }
}

// ── LOAD INTO EDITOR ───────────────────────────────────
function loadArticle(id) {
  const a = articles.find(x => x.id === id);
  if (!a) return;
  editingId = id;
  document.getElementById('editorTitle').textContent = 'Modifica articolo';
  document.getElementById('artTitle').value = a.title;
  document.getElementById('artSubtitle').value = a.subtitle || '';
  document.getElementById('artCategory').value = a.category;
  document.getElementById('artDate').value = a.date || '';
  document.getElementById('artAuthor').value = a.author;
  document.getElementById('artReadTime').value = a.read_time || '5';
  document.getElementById('artCoverUrl').value = '';
  document.getElementById('contentArea').innerHTML = a.content || '';
  tags = [...(a.tags || [])];
  renderTags();

  const p = document.getElementById('coverPreview');
  let img = p.querySelector('img');
  if (a.cover) {
    if (!img) { img = document.createElement('img'); p.prepend(img); }
    img.src = a.cover;
  } else {
    if (img) img.remove();
  }

  document.getElementById('deleteBtn').style.display = 'inline-block';
  renderList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── RESET ──────────────────────────────────────────────
function resetForm() {
  editingId = null;
  tags = [];
  ['artTitle','artSubtitle','artAuthor','artReadTime','artCoverUrl'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('artDate').value = new Date().toISOString().slice(0, 10);
  document.getElementById('contentArea').innerHTML = '';
  const img = document.getElementById('coverPreview').querySelector('img');
  if (img) img.remove();
  renderTags();
  document.getElementById('editorTitle').textContent = 'Nuovo articolo';
  document.getElementById('deleteBtn').style.display = 'none';
  renderList();
}

// ── RENDER LIST ────────────────────────────────────────
function renderList() {
  const container = document.getElementById('articleList');
  document.getElementById('listCount').textContent = articles.length + ' articol' + (articles.length === 1 ? 'o' : 'i');

  if (!articles.length) {
    container.innerHTML = `<div class="empty-list"><span style="font-size:2rem;display:block;margin-bottom:.5rem">✍️</span>Nessun articolo ancora.<br>Creane uno qui a sinistra.</div>`;
    return;
  }

  container.innerHTML = articles.map(a => `
    <div class="article-card ${editingId === a.id ? 'active' : ''}" onclick="loadArticle('${a.id}')">
      <div class="ac-top">
        <div class="ac-title">${a.title}</div>
        <span class="ac-status ${a.status}">${a.status === 'published' ? 'Pubblicato' : 'Bozza'}</span>
      </div>
      <div class="ac-meta">
        <span>${a.category}</span>
        <span>${formatDate(a.date)}</span>
        <span>${a.read_time} min</span>
      </div>
      <div class="ac-actions" onclick="event.stopPropagation()">
        <button class="ac-btn" onclick="loadArticle('${a.id}')">Modifica</button>
        <button class="ac-btn del" onclick="quickDelete('${a.id}')">Elimina</button>
      </div>
    </div>
  `).join('');
}

// ── QUICK DELETE ───────────────────────────────────────
async function quickDelete(id) {
  if (!confirm('Eliminare questo articolo?')) return;
  try {
    await api.delete(id);
    if (editingId === id) resetForm();
    await loadList();
    showToast('Articolo eliminato');
  } catch (err) {
    showToast('Errore: ' + err.message, 'error');
  }
}

// ── LOAD LIST ──────────────────────────────────────────
async function loadList() {
  try {
    articles = await api.list();
    renderList();
  } catch (err) {
    document.getElementById('articleList').innerHTML = `<div class="empty-list" style="color:var(--red)">Errore connessione Supabase.<br><small>${err.message}</small></div>`;
  }
}

// ── INIT ───────────────────────────────────────────────
document.getElementById('artDate').value = new Date().toISOString().slice(0, 10);
if (checkAuth()) loadList();

function formatDate(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-');
  const months = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
</script>
</body>
</html>
