name: Build Blog Pages

on:
  # Triggerato dal CMS quando pubblica un articolo
  repository_dispatch:
    types: [publish-article]

  # Trigger manuale di emergenza da GitHub UI
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SITE_BASE: ${{ secrets.SITE_BASE }}
        run: node generate-blog.js

      - name: Commit and push generated pages
        run: |
          git config user.name "DUPY Bot"
          git config user.email "bot@dupy.it"
          git add blog/ sitemap-blog.xml
          git diff --cached --quiet || git commit -m "🤖 Build: aggiorna pagine blog"
          git push
